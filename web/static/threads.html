<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jmon - Threads</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #0f1117; color: #e0e0e0; }
  .nav { background: #1a1d29; padding: 12px 24px; display: flex; align-items: center; gap: 24px;
         border-bottom: 1px solid #2a2d3a; }
  .nav a { color: #8b8fa3; text-decoration: none; font-size: 14px; }
  .nav a:hover, .nav a.active { color: #60a5fa; }
  .nav .logo { color: #60a5fa; font-weight: bold; font-size: 18px; margin-right: 16px; }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .card { background: #1a1d29; border-radius: 12px; padding: 20px; margin-bottom: 20px;
          border: 1px solid #2a2d3a; }
  .card h2 { font-size: 16px; margin-bottom: 16px; color: #8b8fa3; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 12px; color: #8b8fa3; font-size: 12px;
       text-transform: uppercase; border-bottom: 1px solid #2a2d3a; }
  td { padding: 10px 12px; border-bottom: 1px solid #1f2233; font-size: 13px; }
  tr:hover td { background: #1f2233; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-run { background: #22c55e20; color: #22c55e; }
  .badge-wait { background: #f59e0b20; color: #f59e0b; }
  .badge-block { background: #ef444420; color: #ef4444; }
  .controls { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
  .controls select, .controls button {
    background: #2a2d3a; color: #e0e0e0; border: 1px solid #3a3d4a;
    padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .controls button:hover { background: #3a3d4a; }
  .stack-trace { font-family: 'Menlo', monospace; font-size: 11px; color: #8b8fa3;
                 white-space: pre-wrap; max-height: 200px; overflow-y: auto;
                 background: #0f1117; padding: 8px; border-radius: 4px; margin-top: 4px; }
  .chart-pie { width: 300px; height: 300px; display: inline-block; vertical-align: top; }
  .stats { display: inline-block; vertical-align: top; padding-left: 24px; }
  .stats div { margin: 6px 0; font-size: 14px; }
  .stats span { color: #8b8fa3; }
</style>
</head><body>
<div class="nav">
  <span class="logo">jmon</span>
  <a href="/dashboard">Dashboard</a>
  <a href="#" id="nav-memory">Memory</a>
  <a href="#" id="nav-cpu">CPU</a>
  <a href="#" class="active" id="nav-threads">Threads</a>
  <a href="#" id="nav-heap">Heap</a>
  <a href="#" id="nav-leak">Leak Check</a>
  <a href="#" id="nav-hotcpu">CPU Hotspot</a>
<a href="#" id="nav-leak-smart">Smart Leak</a>
</div>
<div class="container">
  <div class="card">
    <h2>Thread Overview</h2>
    <div id="pie-chart" class="chart-pie"></div>
    <div class="stats" id="thread-stats"></div>
  </div>
  <div class="card">
    <h2>Thread List</h2>
    <div class="controls">
      <select id="top-n" onchange="loadThreads()">
        <option value="20">Top 20</option>
        <option value="50" selected>Top 50</option>
        <option value="100">Top 100</option>
        <option value="500">All</option>
      </select>
      <button onclick="loadThreads()">Refresh</button>
    </div>
    <table id="thread-table">
      <thead><tr><th>Thread Name</th><th>State</th><th>CPU %</th><th>Stack Trace</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script>
const pid = location.pathname.split('/')[2];
document.getElementById('nav-memory').href = '/process/' + pid + '/memory';
document.getElementById('nav-cpu').href = '/process/' + pid + '/cpu';
document.getElementById('nav-threads').href = '/process/' + pid + '/threads';
document.getElementById('nav-heap').href = '/process/' + pid + '/heap';
document.getElementById('nav-leak').href = '/process/' + pid + '/leak';
document.getElementById('nav-hotcpu').href = '/process/' + pid + '/hotcpu';
document.getElementById('nav-leak-smart').href = '/process/' + pid + '/leak-smart';

const pieChart = echarts.init(document.getElementById('pie-chart'), 'dark');

function stateBadge(state) {
  if (!state) return '<span class="badge">UNKNOWN</span>';
  if (state.includes('RUNNABLE')) return '<span class="badge badge-run">RUNNABLE</span>';
  if (state.includes('BLOCKED')) return '<span class="badge badge-block">BLOCKED</span>';
  if (state.includes('WAITING') || state.includes('TIMED_WAITING')) return '<span class="badge badge-wait">WAITING</span>';
  return '<span class="badge">' + state + '</span>';
}

async function loadThreads() {
  const top = document.getElementById('top-n').value;
  const resp = await fetch('/api/process/' + pid + '/threads?top=' + top);
  const data = await resp.json();

  // Update pie chart
  const stateCounts = {};
  if (data) data.forEach(t => { stateCounts[t.State] = (stateCounts[t.State] || 0) + 1; });
  const pieData = Object.entries(stateCounts).map(([name, value]) => ({name, value}));

  pieChart.setOption({
    backgroundColor: '#1a1d29',
    tooltip: { trigger: 'item' },
    series: [{
      type: 'pie', radius: ['40%', '70%'],
      data: pieData,
      label: { color: '#8b8fa3' },
      itemStyle: { borderColor: '#1a1d29', borderWidth: 2 }
    }]
  });

  document.getElementById('thread-stats').innerHTML =
    '<div>Total: <b>' + (data ? data.length : 0) + '</b> threads</div>' +
    Object.entries(stateCounts).map(([s, c]) =>
      '<div>' + stateBadge(s) + ' <span>' + c + '</span></div>'
    ).join('');

  const tbody = document.querySelector('#thread-table tbody');
  tbody.innerHTML = '';
  if (!data) return;
  for (const t of data) {
    const tr = document.createElement('tr');
    const stack = t.StackTrace
      ? '<details><summary style="cursor:pointer;color:#60a5fa">View</summary><div class="stack-trace">' + t.StackTrace.replace(/</g,'&lt;') + '</div></details>'
      : '-';
    tr.innerHTML = '<td>' + t.ThreadName + '</td><td>' + stateBadge(t.State) + '</td><td>' + (t.CPUPct || 0).toFixed(1) + '%</td><td>' + stack + '</td>';
    tbody.appendChild(tr);
  }
}
loadThreads();
window.addEventListener('resize', () => pieChart.resize());
</script>
</body></html>
