<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jmon - CPU Chart</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #0f1117; color: #e0e0e0; }
  .nav { background: #1a1d29; padding: 12px 24px; display: flex; align-items: center; gap: 24px;
         border-bottom: 1px solid #2a2d3a; }
  .nav a { color: #8b8fa3; text-decoration: none; font-size: 14px; }
  .nav a:hover, .nav a.active { color: #60a5fa; }
  .nav .logo { color: #60a5fa; font-weight: bold; font-size: 18px; margin-right: 16px; }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .card { background: #1a1d29; border-radius: 12px; padding: 20px; margin-bottom: 20px;
          border: 1px solid #2a2d3a; }
  .card h2 { font-size: 16px; margin-bottom: 16px; color: #8b8fa3; }
  .chart { width: 100%; height: 500px; }
  .controls { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
  .controls select, .controls button {
    background: #2a2d3a; color: #e0e0e0; border: 1px solid #3a3d4a;
    padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .controls button:hover { background: #3a3d4a; }
</style>
</head><body>
<div class="nav">
  <span class="logo">jmon</span>
  <a href="/dashboard">Dashboard</a>
  <a href="#" id="nav-memory">Memory</a>
  <a href="#" class="active" id="nav-cpu">CPU</a>
  <a href="#" id="nav-threads">Threads</a>
  <a href="#" id="nav-heap">Heap</a>
  <a href="#" id="nav-leak">Leak Check</a>
  <a href="#" id="nav-hotcpu">CPU Hotspot</a>
<a href="#" id="nav-leak-smart">Smart Leak</a>
</div>
<div class="container">
  <div class="card">
    <h2>CPU Usage Over Time</h2>
    <div class="controls">
      <select id="duration" onchange="loadChart()">
        <option value="1h">Last 1 Hour</option>
        <option value="6h" selected>Last 6 Hours</option>
        <option value="24h">Last 24 Hours</option>
        <option value="72h">Last 3 Days</option>
        <option value="168h">Last 7 Days</option>
        <option value="720h">Last 30 Days</option>
      </select>
      <button onclick="loadChart()">Refresh</button>
    </div>
    <div id="cpu-chart" class="chart"></div>
  </div>
  <div class="card">
    <h2>Memory Usage (RSS)</h2>
    <div id="mem-chart" class="chart"></div>
  </div>
</div>
<script>
const pid = location.pathname.split('/')[2];
document.getElementById('nav-memory').href = '/process/' + pid + '/memory';
document.getElementById('nav-cpu').href = '/process/' + pid + '/cpu';
document.getElementById('nav-threads').href = '/process/' + pid + '/threads';
document.getElementById('nav-heap').href = '/process/' + pid + '/heap';
document.getElementById('nav-leak').href = '/process/' + pid + '/leak';
document.getElementById('nav-hotcpu').href = '/process/' + pid + '/hotcpu';
document.getElementById('nav-leak-smart').href = '/process/' + pid + '/leak-smart';

const cpuChart = echarts.init(document.getElementById('cpu-chart'), 'dark');
const memChart = echarts.init(document.getElementById('mem-chart'), 'dark');

async function loadChart() {
  const duration = document.getElementById('duration').value;
  const resp = await fetch('/api/process/' + pid + '/cpu?from=' + duration);
  const data = await resp.json();
  if (!data || data.length === 0) { cpuChart.clear(); memChart.clear(); return; }
  const times = data.map(d => d.Timestamp);

  cpuChart.setOption({
    backgroundColor: '#1a1d29',
    tooltip: { trigger: 'axis', formatter: function(p) {
      return p[0].axisValue + '<br/>CPU: ' + p[0].value + '%';
    }},
    grid: { left: 60, right: 20, top: 30, bottom: 40 },
    xAxis: { type: 'category', data: times, boundaryGap: false,
      axisLabel: { color: '#8b8fa3', formatter: v => v.substring(5, 16) } },
    yAxis: { type: 'value', name: '%', axisLabel: { color: '#8b8fa3' },
      splitLine: { lineStyle: { color: '#2a2d3a' } } },
    visualMap: { show: false, pieces: [{ gt: 0, lte: 50, color: '#22c55e' },
      { gt: 50, lte: 80, color: '#f59e0b' }, { gt: 80, color: '#ef4444' }] },
    series: [{
      type: 'line', smooth: true, symbol: 'none',
      areaStyle: { opacity: 0.3 },
      lineStyle: { width: 2 },
      data: data.map(d => +d.CPUPct.toFixed(1))
    }]
  });

  memChart.setOption({
    backgroundColor: '#1a1d29',
    tooltip: { trigger: 'axis', formatter: function(p) {
      let s = p[0].axisValue;
      p.forEach(item => { s += '<br/>' + item.seriesName + ': ' + item.value; });
      return s;
    }},
    legend: { data: ['Memory %', 'RSS (MB)'], textStyle: { color: '#8b8fa3' } },
    grid: { left: 60, right: 60, top: 40, bottom: 40 },
    xAxis: { type: 'category', data: times, boundaryGap: false,
      axisLabel: { color: '#8b8fa3', formatter: v => v.substring(5, 16) } },
    yAxis: [
      { type: 'value', name: '%', axisLabel: { color: '#8b8fa3' },
        splitLine: { lineStyle: { color: '#2a2d3a' } } },
      { type: 'value', name: 'MB', axisLabel: { color: '#8b8fa3' },
        splitLine: { show: false } }
    ],
    series: [
      { name: 'Memory %', type: 'line', smooth: true, symbol: 'none', yAxisIndex: 0,
        areaStyle: { opacity: 0.4, color: '#60a5fa' },
        lineStyle: { color: '#60a5fa', width: 2 }, itemStyle: { color: '#60a5fa' },
        data: data.map(d => +d.MemPct.toFixed(1)) },
      { name: 'RSS (MB)', type: 'line', smooth: true, symbol: 'none', yAxisIndex: 1,
        lineStyle: { color: '#22c55e', width: 2 }, itemStyle: { color: '#22c55e' },
        data: data.map(d => +(d.MemRSS/1024).toFixed(1)) }
    ]
  });
}
loadChart();
window.addEventListener('resize', () => { cpuChart.resize(); memChart.resize(); });
</script>
</body></html>
